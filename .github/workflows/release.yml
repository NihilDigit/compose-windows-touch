name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Runs the tests without publishing: the publish job below is gated to tag pushes.
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest --no-daemon --stacktrace

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches build.gradle.kts version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(grep -E '^version\s*=\s*"' build.gradle.kts | head -1 | sed -E 's/.*"(.+)".*/\1/')
          echo "tag=$TAG  version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match build.gradle.kts version $VERSION"
            exit 1
          fi
          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "::error::Refusing to release a SNAPSHOT version ($VERSION)"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # The release page appears only after Central has accepted the upload, so a tag without one means the
      # publish step failed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
